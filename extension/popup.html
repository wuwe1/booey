<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --bg-1: #0a0a0a;
      --bg-sel: #1a1100;
      --border: #2a2a2a;
      --amber: #ff9f1a;
      --cyan: #00d2ff;
      --green: #3fff7d;
      --red: #ff4040;
      --fg: #e8e8e8;
      --fg-2: #ccc;
      --fg-3: #888;
      --fg-4: #666;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--fg);
      font: 11px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    }

    /* header */
    .head {
      height: 28px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--amber);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }
    .brand { color: var(--amber); font-weight: 700; letter-spacing: 0.08em; }
    .spacer { flex: 1; }
    .pill { color: var(--fg-3); display: flex; align-items: center; gap: 4px; }
    .pill .dot { color: var(--green); }
    .pill.offline .dot, .pill.halted .dot { color: var(--red); }
    .pill.connecting .dot { color: var(--amber); }
    button {
      background: transparent;
      color: var(--amber);
      border: 1px solid var(--amber);
      font: inherit;
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    button:hover { background: var(--bg-sel); }

    /* body rows */
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      min-height: 30px;
    }
    .k {
      color: var(--fg-4);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 9.5px;
      width: 66px;
      flex-shrink: 0;
    }
    .v { color: var(--fg-2); }
    .id {
      color: var(--cyan);
      cursor: pointer;
      user-select: all;
    }
    .id:hover { color: #fff; }
    .copied { color: var(--green); font-size: 9px; }

    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      font: inherit;
      font-size: 11px;
      padding: 2px 6px;
      outline: none;
      min-width: 0;
    }
    input:focus { border-color: var(--amber); }
    .saved { color: var(--green); font-size: 9px; }

    /* warning banner (version mismatch / halted) */
    .warn {
      display: none;
      padding: 7px 10px;
      background: #2a0a0a;
      border-bottom: 1px solid var(--red);
      color: var(--red);
      font-size: 10px;
      line-height: 1.4;
    }
    .warn.show { display: block; }

    /* counters */
    .counters {
      display: flex;
      padding: 8px 10px;
      gap: 0;
    }
    .counter { flex: 1; text-align: center; }
    .counter .n { font-size: 15px; color: var(--fg); }
    .counter.filtered .n { color: var(--fg-3); }
    .counter.dropped .n { color: var(--amber); }
    .counter .lbl {
      display: block;
      color: var(--fg-4);
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">CDP-RELAY</span>
    <span class="spacer"></span>
    <span class="pill offline" id="daemon-pill">
      <span class="dot">●</span><span id="daemon-state">offline</span>
      <span style="color:var(--fg-4)">:</span><span id="daemon-port">9224</span>
    </span>
    <button id="reconnect" title="reconnect to daemon">⟳</button>
  </div>

  <div class="warn" id="warn"></div>

  <div class="row">
    <span class="k">Browser</span>
    <span class="v id" id="browser-id" title="click to copy full id">…</span>
    <span class="copied" id="id-copied"></span>
  </div>

  <div class="row">
    <span class="k">Label</span>
    <input id="label-input" placeholder="e.g. shopee-A" maxlength="64" />
    <span class="saved" id="label-saved"></span>
  </div>

  <div class="row">
    <span class="k">Protocol</span>
    <span class="v" id="proto">v—</span>
    <span class="spacer"></span>
    <span class="k" style="width:auto">Attached</span>
    <span class="v" id="attached">0</span>
  </div>

  <div class="counters" title="events, since this service worker started">
    <div class="counter"><span class="n" id="c-matched">0</span><span class="lbl">matched</span></div>
    <div class="counter filtered"><span class="n" id="c-filtered">0</span><span class="lbl">filtered</span></div>
    <div class="counter dropped"><span class="n" id="c-dropped">0</span><span class="lbl">dropped</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
